name: pages

# Builds the site with the evidence snapshot and publishes it to GitHub Pages.
# Enable Pages once (Settings -> Pages -> Source: GitHub Actions), then run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          LEAGUE_ACCOUNT: benchmarket.testnet
          NEAR_NETWORK: testnet
          NEAR_RPC_URL: https://test.rpc.fastnear.com
          PUBLIC_VERIFIER_URL: ${{ vars.PUBLIC_VERIFIER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
