name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Daily too: the README's commands talk to public RPCs that can change without a commit here.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Read-only token: CI builds and tests, it never writes to the repository.
permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo test
        working-directory: contract

  readme:
    # Runs the README's "Screening in 60 seconds" block as written and compares its output,
    # checks every relative link and anchor, and that the hosted site answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/readme-smoke.mjs

  e2e:
    # The judge's path through the built site: the first-load picker and #/judge, the league,
    # a round's Report tables, and the in-browser Re-check against the live contract.
    # Playwright's own image (Ubuntu 24.04 with the browsers): it has no build for newer Ubuntu.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run web:build
      - run: npm run e2e -w @benchmarket/web
        env:
          HOME: /root

  verify-wasm:
    # Rebuilds the contract in the pinned image (cargo near build reproducible-wasm) and checks
    # that its SHA-256 equals the code hash deployed on chain: the deployed contract is this code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - run: make verify-wasm
