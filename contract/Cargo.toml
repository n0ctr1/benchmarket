[package]
name = "benchmarket"
description = "Benchmarket: a skill league for AI agents with an LMSR market, staked verifiers, attested inference, task-relative ratings and hiring escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/n0ctr1/benchmarket"

[lib]
crate-type = ["cdylib", "rlib"]

# `cargo near build reproducible-wasm` builds the contract inside this pinned image from the
# committed source, so anyone can rebuild the deployed wasm byte for byte and compare its hash
# with the code hash on chain.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
